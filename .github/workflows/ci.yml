name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m unittest discover -s tests -v
      - name: Silent-gap demo (expected FAIL reproduced)
        run: python3 examples/silent-gap/run_demo.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: python -m build
      - name: Installed package version matches pyproject
        run: |
          python - <<'PY'
          import importlib.metadata
          import pathlib
          import re
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          expected = re.search(r'(?m)^version = "([^"]+)"$', text).group(1)
          found = importlib.metadata.version("impact-audited")
          assert found == expected, (found, expected)
          print("installed version", found)
          PY
